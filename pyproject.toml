[project]
name = "djinn"
version = "0.1.0"
description = "Djinn — Personal AI Voice Assistant"
requires-python = ">=3.11"

dependencies = [
    # Core voice pipeline
    "faster-whisper>=1.1.0",
    # VAD: Silero v6 via onnxruntime, from faster-whisper's bundled model.
    # Not the silero-vad package: it pulls in PyTorch, blocked by Smart App Control.
    "kokoro-onnx>=0.4.0",
    "onnxruntime>=1.17.0",
    "edge-tts>=6.1.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    "numpy>=2.0.2",
    # Brain
    "httpx>=0.28.1",               # Ollama (local model) client
    # Memory & Config
    "pyyaml>=6.0",
    "peewee>=3.17.0",
    "python-dotenv>=1.0.1",
    # System
    "keyboard>=0.13.5",
    "google-genai>=2.11.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.24.0.43",
]

[project.scripts]
djinn = "djinn.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
